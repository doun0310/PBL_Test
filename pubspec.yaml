name: meal_management_app
description: 학교 식단 관리 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 요청
  http: ^1.1.0

  # 로컬 저장소 (JWT 토큰 저장)
  shared_preferences: ^2.2.2

  # 날짜 포맷팅
  intl: ^0.20.2

  # 아이콘
  cupertino_icons: ^1.0.2

  # 이미지 선택 (음식 사진 촬영/선택)
  image_picker: ^1.0.4

  # 카메라 기능
  camera: ^0.10.5+5

  # 차트 (주간/월간 분석)
  fl_chart: ^0.66.0

  # 파일 경로 처리
  path_provider: ^2.1.1

  # 권한 관리
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
