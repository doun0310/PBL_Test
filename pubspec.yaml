name: meal_management_app
description: 종합 식단 및 칼로리 추적 애플리케이션
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 요청
  http: ^1.1.0

  # 로컬 저장소 (JWT 토큰 저장)
  shared_preferences: ^2.2.2

  # 날짜 포맷팅
  intl: ^0.20.2

  # 아이콘
  cupertino_icons: ^1.0.2

  # 이미지 선택 (카메라/갤러리)
  image_picker: ^1.0.4

  # 차트 라이브러리
  fl_chart: ^0.65.0

  # 프로그레스 인디케이터
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
