# ============================================================
# Dataset structure should look like:
# datasets/korean_food/
# ├── images/
# │   ├── train/              # 80% of data (~218,226 images)
# │   │   ├── img001.jpg
# │   │   └── ...
# │   └── val/                # 20% of data (~54,557 images)
# │       ├── img101.jpg
# │       └── ...
# └── labels/
#     ├── train/
#     │   ├── img001.txt      # YOLO format annotations
#     │   └── ...
#     └── val/
#         └── ...
#
# Label format (YOLO format):
# Each .txt file contains one line per object:
# <class_id> <x_center> <y_center> <width> <height>
# All values are normalized (0-1) relative to image dimensions
# Example: 31 0.5 0.5 0.3 0.4  (bulgogi in center of image)
# ============================================================
