# YOLO v8 Dataset Configuration for Food Detection
# ==================================================
# This configuration supports multiple dataset options for YOLO training.
#
# Available Datasets (via download_datasets.py):
# 1. Food-11 (16,643 images, 11 classes) - General food classification
# 2. Food-101 (101,000 images, 101 classes) - Large-scale food recognition
# 3. Korean Food (3,000+ images, Korean food specific)
#
# ⚠️ IMPORTANT: Choose ONE dataset configuration below by uncommenting it
#
# Modify the paths according to your dataset location.

# ============================================================
# OPTION 1: Food-11 Dataset (Recommended for Quick Start)
# ============================================================
path: ./datasets/food11       # Root directory of the dataset
train: images/train           # Training images (relative to 'path')
val: images/val               # Validation images (relative to 'path')
test: images/test             # Test images (optional, relative to 'path')

# Number of classes for Food-11
nc: 11

# Food-11 Class Names
names:
  0: Bread
  1: Dairy product
  2: Dessert
  3: Egg
  4: Fried food
  5: Meat
  6: Noodles-Pasta
  7: Rice
  8: Seafood
  9: Soup
  10: Vegetable-Fruit

