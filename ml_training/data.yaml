# ============================================================
# Dataset structure for each option:
# ============================================================

# Option 1: Food-11
# datasets/food11/
# ├── images/
# │   ├── train/
# │   │   ├── img001.jpg
# │   │   └── ...
# │   └── val/
# │       ├── img101.jpg
# │       └── ...
# └── labels/
#     ├── train/
#     │   ├── img001.txt      # YOLO format annotations
#     │   └── ...
#     └── val/
#         └── ...

# Option 2: Food-101
# datasets/food101/
# ├── images/
# │   ├── train/
# │   └── val/
# └── labels/
#     ├── train/
#     └── val/

# Option 3: Korean Food (Kaggle)
# datasets/korean_food/
# ├── images/
# │   ├── train/
# │   └── val/
# └── labels/
#     ├── train/
#     └── val/

# Option 4: AI Hub Korean Health Food
# datasets/aihub_korean_food/
# ├── images/
# │   ├── train/
# │   └── val/
# └── labels/
#     ├── train/
#     └── val/

# ============================================================
# Label format (YOLO format):
# Each .txt file contains one line per object:
# <class_id> <x_center> <y_center> <width> <height>
# All values are normalized (0-1) relative to image dimensions
# Example: 5 0.5 0.5 0.3 0.4  (Meat in center of image)
# ============================================================

# ============================================================
# Download Instructions:
# ============================================================
# 1. Setup dataset directory structure:
#    python download_datasets.py --setup-structure
#
# 2. Download specific dataset:
#    python download_datasets.py --download-food11
#    python download_datasets.py --download-food101
#    python download_datasets.py --download-korean-food
#    # For AI Hub dataset: Manual download required (Korean account needed)
#    # Visit: https://aihub.or.kr/aihubdata/data/view.do?dataSetSn=74
#    # Then use: python convert_aihub_to_yolo.py --input <download_path> --output datasets/aihub_korean_food
#
# 3. Download all YOLO datasets:
#    python download_datasets.py --download-all-yolo
#
# 4. Verify downloads:
#    python download_datasets.py --verify
#
# 5. Start training with selected dataset:
#    python yolo_training.py --data data.yaml --epochs 100
# ============================================================

