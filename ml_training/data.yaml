# YOLO v8 Dataset Configuration for Korean Food Detection
# =========================================================
# This configuration is designed for fine-tuning YOLO v8 on Korean food images.
#
# Training Data Sources:
# 1. Kaggle 'Food-11 image dataset' (16,643 images)
#    - General food recognition training
#
# 2. AI Hub '건강관리를 위한 음식 이미지' (Health Management Food Images)
#    - Original: 3,000,000 images with 3,500 classes
#    - Reduced: 272,783 images with 154 classes (hardware constraints)
#
# Modify the paths according to your dataset location.

# Dataset paths (relative to this file or absolute paths)
path: ./datasets/korean_food  # Root directory of the dataset
train: images/train           # Training images (relative to 'path')
val: images/val               # Validation images (relative to 'path')
test: images/test             # Test images (optional, relative to 'path')

# Number of classes (reduced from 3,500 to 154 for training efficiency)
nc: 154

# Class names - Korean food items (154 classes from AI Hub dataset)
# Each class represents a specific Korean dish for accurate calorie tracking
names:
